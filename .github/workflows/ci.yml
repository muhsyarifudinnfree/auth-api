name: Continuous Integration

on:
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Gunakan versi Node.js yang stabil (LTS).
        # Jika 24.11.0 belum stabil, disarankan pakai 20.x atau 22.x
        node-version: [22.x]

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: mysecretpassword
          POSTGRES_DB: forumapi_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      # 1. Update ke v4 karena v2 sudah deprecated (usang)
      - uses: actions/checkout@v4

      # 2. Update ke v4 dan tambahkan cache untuk mempercepat install
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: npm install migrate and test
        run: |
          # Ganti 'npm ci' ke 'npm install' jika Anda belum push package-lock.json
          npm install 
          npm run migrate up
          npm run test
        env:
          CI: true
          HOST: localhost
          PORT: 3000
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: mysecretpassword
          PGDATABASE: forumapi_test
          ACCESS_TOKEN_KEY: secret
          REFRESH_TOKEN_KEY: terces
          ACCESS_TOKEN_AGE: 3600
